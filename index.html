<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дуальное обучение: учёт студентов и выпускников</title>
<style>
:root{
  --bg:#EDF0F2;--surface:#FFFFFF;--surface-2:#F4F6F7;--ink:#18232D;--ink-2:#51606D;--ink-3:#7A8794;
  --line:#D5DCE1;--line-2:#E6EAED;--bar:#22394A;--bar-ink:#E8EEF2;--bar-ink-2:#A3B5C2;
  --primary:#245E86;--primary-ink:#FFFFFF;--primary-soft:#E2EDF5;--signal:#F0AC00;--signal-ink:#2A1F00;
  --danger:#B23A2E;--danger-soft:#F8E4E1;--ok:#2E7A4C;--ok-soft:#E0F0E6;--warn:#9A6500;--warn-soft:#FBEFD2;
  --g5:#2E7A4C;--g4:#6B962F;--g3:#C68700;--g2:#B23A2E;--on-grade:#FFFFFF;
  --shadow:0 10px 30px rgba(16,30,42,.18);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11181E;--surface:#182129;--surface-2:#1E2932;--ink:#E3E9EE;--ink-2:#A3B1BC;--ink-3:#7D8C98;
    --line:#2D3A45;--line-2:#24303A;--bar:#0F1A22;--bar-ink:#E3E9EE;--bar-ink-2:#8FA2B1;
    --primary:#5A9FD0;--primary-ink:#06121B;--primary-soft:#1D3242;--signal:#F2B51F;--signal-ink:#231900;
    --danger:#E87A6C;--danger-soft:#3A1F1C;--ok:#62BA85;--ok-soft:#1B3326;--warn:#E3AD45;--warn-soft:#3A2E14;
    --g5:#4FAE74;--g4:#93BD52;--g3:#E0A62A;--g2:#E06A5C;--on-grade:#0C1610;
    --shadow:0 12px 32px rgba(0,0,0,.55);color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:14px/1.45 "Segoe UI","PT Sans",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
[hidden]{display:none!important}

/* Шапка */
.appbar{background:var(--bar);color:var(--bar-ink);position:sticky;top:0;z-index:20}
.appbar-top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 24px 4px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand b{display:block;font-size:17px;font-weight:600}
.brand span{display:block;font-size:12.5px;color:var(--bar-ink-2)}
.appbar-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.role{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--bar-ink-2)}
.role select{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:var(--bar-ink);border-radius:6px;padding:4px 8px;min-height:32px;width:auto}
.role select option{color:#18232D;background:#fff}
.iconbtn{background:transparent;border:1px solid transparent;color:inherit;border-radius:6px;width:36px;height:36px;display:inline-grid;place-items:center;cursor:pointer;position:relative;flex:none}
.appbar .iconbtn:hover{background:rgba(255,255,255,.1)}
.badge{position:absolute;top:1px;right:-2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--signal);color:var(--signal-ink);font-size:11px;font-weight:700;line-height:18px;text-align:center}
.user{font-size:13px;text-align:right;line-height:1.25}
.user small{display:block;color:var(--bar-ink-2);font-size:11.5px}
.tabs{display:flex;gap:4px;padding:0 14px;overflow-x:auto}
.tab{background:none;border:0;color:var(--bar-ink-2);padding:10px 12px 11px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
.tab:hover{color:var(--bar-ink)}
.tab[aria-selected="true"]{color:var(--bar-ink);border-bottom-color:var(--signal)}

/* Страница */
main{padding:20px 24px 56px;max-width:1520px;margin:0 auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:22px;font-weight:600;margin:0}
h1 .count{font-weight:400;color:var(--ink-3);margin-left:8px;font-size:18px}
h2{font-size:17px;font-weight:600;margin:0}
h3{font-size:14.5px;font-weight:600;margin:0 0 10px}
.sub{color:var(--ink-2);margin:4px 0 0;font-size:13.5px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 13px;border-radius:6px;cursor:pointer;font-weight:500;white-space:nowrap;min-height:34px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger)}
.btn.danger.solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.small{padding:3px 9px;font-size:12.5px;min-height:28px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.panel + .panel{margin-top:16px}

/* Фильтры */
.filters{display:flex;flex-wrap:wrap;gap:10px 12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:flex-end}
.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-2);min-width:140px;flex:1 1 150px;max-width:230px}
.f.search{flex:2 1 220px;max-width:320px}
.f.check{flex-direction:row;align-items:center;gap:8px;min-width:auto;flex:0 0 auto;font-size:13px;color:var(--ink);padding-bottom:7px}
.f.check input{width:auto;min-height:auto}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 9px;min-height:34px;width:100%}
textarea{min-height:96px;resize:vertical;line-height:1.45}
input:disabled,select:disabled,textarea:disabled{background:var(--surface-2);color:var(--ink-2);opacity:1}
input[type=checkbox],input[type=radio]{width:16px;height:16px;min-height:auto;accent-color:var(--primary)}

/* Таблицы */
.table-wrap{overflow-x:auto}
table.grid{width:100%;border-collapse:collapse;font-size:13.5px}
.grid th{text-align:left;font-weight:600;font-size:12.5px;color:var(--ink-2);background:var(--surface-2);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.grid th[data-sort]{cursor:pointer;user-select:none}
.grid th[data-sort]:hover{color:var(--ink)}
.grid th .arr{color:var(--primary);margin-left:3px}
.grid td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
.grid tbody tr:last-child td{border-bottom:0}
.grid tr.row{cursor:pointer}
.grid tr.row:hover td,.grid tr.row:focus-visible td{background:var(--surface-2)}
.grid tr.row:focus-visible{outline:2px solid var(--signal);outline-offset:-2px}
.grid td small{display:block;color:var(--ink-3);font-size:12px}
.grid td b{font-weight:600}
.grid td.num,.grid th.num{text-align:right}
.grid tr.total td{font-weight:600;background:var(--surface-2)}
.grid tr.sec td{font-weight:600;background:var(--surface-2);color:var(--ink-2)}
.empty{padding:40px 16px;text-align:center;color:var(--ink-2)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;font-size:13px;color:var(--ink-2);flex-wrap:wrap;border-top:1px solid var(--line)}
.pager .pg{display:flex;gap:6px;align-items:center}
.pager select{width:auto;min-height:30px;padding:3px 6px}

/* Полоса экзаменов: 4 семестра */
.track{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;vertical-align:middle}
.track span{width:25px;height:25px;display:grid;place-items:center;font-weight:700;font-size:13px;border-left:1px solid var(--line)}
.track span:first-child{border-left:0}
.g5{background:var(--g5);color:var(--on-grade)}.g4{background:var(--g4);color:var(--on-grade)}
.g3{background:var(--g3);color:var(--on-grade)}.g2{background:var(--g2);color:var(--on-grade)}
.g0{color:var(--ink-3);background:repeating-linear-gradient(135deg,transparent 0 4px,var(--line-2) 4px 5px)}
.gx{color:var(--danger);background:var(--danger-soft)}
.grade{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-weight:700;font-size:13px}

/* Статусы */
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.st-train{background:var(--primary-soft);color:var(--primary);border-color:transparent}
.st-term{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.st-done{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.st-hired{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.t-hire{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.t-move,.t-prof{background:var(--primary-soft);color:var(--primary);border-color:transparent}
.t-rank{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.t-fire{background:var(--danger-soft);color:var(--danger);border-color:transparent}

/* Ближайшие события */
.events{border-left:4px solid var(--signal);margin-bottom:16px}
.events-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.ev{display:grid;grid-template-columns:170px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:8px 14px;border:0;border-bottom:1px solid var(--line-2);cursor:pointer;background:none;width:100%;text-align:left}
.ev:hover{background:var(--surface-2)}
.ev:last-child{border-bottom:0}
.ev .who{font-weight:600}
.ev .what{color:var(--ink-2)}
.ev .when{color:var(--ink-3);font-size:12.5px;white-space:nowrap}
.k{font-size:12px;font-weight:600;padding:2px 8px;border-radius:4px;justify-self:start;white-space:nowrap}
.k-overdue,.k-final{background:var(--danger-soft);color:var(--danger)}
.k-exam{background:var(--warn-soft);color:var(--warn)}
.k-contract{background:var(--primary-soft);color:var(--primary)}
.k-1c{background:var(--ok-soft);color:var(--ok)}
.bell-panel{position:fixed;top:58px;right:16px;width:min(460px,calc(100vw - 32px));max-height:72vh;overflow:auto;z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.bell-panel .ev{grid-template-columns:minmax(0,1fr) auto}
.bell-panel .ev .k{grid-column:1/-1}

/* Обмен с 1С */
.sync-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.sync-head p{margin:2px 0 0;color:var(--ink-2);font-size:13px}

/* Карточка */
.scrim{position:fixed;inset:0;background:rgba(10,20,28,.42);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(940px,100vw);background:var(--bg);z-index:51;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.drawer.enter{animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(28px);opacity:.5}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.98);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.drawer,.modal{animation:none}}
.d-head{background:var(--surface);padding:16px 20px 12px;display:flex;justify-content:space-between;gap:12px}
.d-head h2{font-size:21px}
.d-sub{display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap;color:var(--ink-2);font-size:13px;margin-top:6px}
.d-actions{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px 12px;background:var(--surface)}
.d-tabs{display:flex;gap:2px;padding:0 12px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
.d-tab{background:none;border:0;padding:10px 12px;cursor:pointer;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.d-tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--primary)}
.d-body{flex:1;overflow:auto;padding:18px 20px 40px}
.section{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px}
.section h3 + .form-grid{margin-top:2px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 14px}
.form-grid + h3{margin-top:18px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-2);min-width:0}
.field.wide{grid-column:1/-1}
.field.inline{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:13.5px;padding-top:20px}
.field .req{color:var(--danger)}
.field.err input,.field.err select,.field.err textarea{border-color:var(--danger)}
.field .msg{color:var(--danger);font-size:12px}
.field small{color:var(--ink-3)}
.hint{font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:9px 11px;margin-top:12px}
.alert{font-size:13.5px;border-radius:6px;padding:10px 12px;margin-bottom:14px;background:var(--danger-soft);color:var(--ink)}
.alert b{color:var(--danger)}
.form-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.cascade{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px 16px}
.kv div span{display:block;font-size:12px;color:var(--ink-3)}
.kv div b{font-weight:600}
.now{border-left:4px solid var(--ok)}
.now.fired{border-left-color:var(--danger)}
.avg{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 4px;font-size:13.5px}
.avg b{font-size:17px}
table.exams td{vertical-align:middle}
table.exams td.field{display:table-cell}
table.exams input,table.exams select{min-width:120px}
.timeline{list-style:none;margin:0;padding:0 0 0 16px;border-left:2px solid var(--line)}
.timeline li{position:relative;padding:0 0 18px 16px}
.timeline li:last-child{padding-bottom:0}
.timeline li::before{content:"";position:absolute;left:-24px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--primary)}
.timeline li.tl-hire::before{border-color:var(--ok)}
.timeline li.tl-fire::before{border-color:var(--danger)}
.timeline li.tl-rank::before{border-color:var(--warn)}
.tl-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tl-date{font-weight:600}
.tl-place{margin-top:3px}
.tl-meta{color:var(--ink-2);font-size:12.5px;margin-top:2px}

/* Модальные окна */
.modal-wrap{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(10,20,28,.5)}
.modal{background:var(--surface);border-radius:10px;width:min(560px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:var(--shadow);animation:pop .14s ease-out}
.modal.wide{width:min(880px,100%)}
.modal header{padding:16px 20px 8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.m-body{padding:8px 20px 4px;overflow:auto}
.m-body p{margin:0 0 10px}
.m-body ul{margin:0 0 10px;padding-left:20px}
.modal footer{padding:14px 20px 16px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line-2);margin-top:12px;flex-wrap:wrap}
.m-err{color:var(--danger);font-size:13px;margin-right:auto;align-self:center}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 24px)}
.toast{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:13.5px;box-shadow:var(--shadow)}

/* Справочники и отчёты */
.split{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}
.side{padding:6px}
.side button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:6px;cursor:pointer;color:var(--ink-2)}
.side button:hover{color:var(--ink);background:var(--surface-2)}
.side button[aria-current="true"]{background:var(--primary-soft);color:var(--primary);font-weight:600}
.side .grp{font-size:12px;color:var(--ink-3);padding:12px 12px 4px}
.p-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:14px;border-bottom:1px solid var(--line)}
.note{padding:10px 14px;font-size:13px;color:var(--ink-2);background:var(--surface-2);border-bottom:1px solid var(--line)}
.off td{color:var(--ink-3)}
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree{padding:8px}
.tree ul{padding-left:20px;border-left:1px dashed var(--line);margin-left:14px}
.node{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:6px;flex-wrap:wrap}
.node:hover{background:var(--surface-2)}
.node .lvl{font-size:12px;color:var(--ink-3)}
.node.off .nm{color:var(--ink-3);text-decoration:line-through}
.node .acts{margin-left:auto;display:flex;gap:6px}
.bar{display:flex;align-items:center;gap:8px;min-width:170px}
.bar .tr{flex:1;height:8px;background:var(--line-2);border-radius:4px;overflow:hidden;min-width:60px}
.bar .tr i{display:block;height:100%;background:var(--primary)}
.bar span{white-space:nowrap;font-size:12.5px}
.rcount{padding:8px 14px;font-size:12.5px;color:var(--ink-2)}
.sec-t{padding:14px 14px 0}
.print-only{display:none}

@media (max-width:900px){.split{grid-template-columns:1fr}}
@media (max-width:640px){
  main{padding:14px 12px 48px}
  .appbar-top{padding:10px 12px 4px}
  .user{display:none}
  .ev{grid-template-columns:1fr}
  .cascade{grid-template-columns:1fr}
  .f{max-width:none}
  .d-body{padding:14px 12px 40px}
}
@media print{
  body *{visibility:hidden}
  .print-area,.print-area *{visibility:visible}
  .print-area{position:absolute;left:0;top:0;width:100%}
  .print-only{display:block}
  .no-print{display:none!important}
}
</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-top">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="6" fill="var(--signal)"/><path d="M8 25h6v-6h6v-6h6" stroke="var(--signal-ink)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><b>Дуальное обучение</b><span>Учёт студентов и выпускников</span></div>
    </div>
    <div class="appbar-tools">
      <label class="role">Роль (демо)
        <select id="roleSel">
          <option value="admin">Администратор</option>
          <option value="spec">Специалист по обучению</option>
          <option value="view">Просмотр</option>
        </select>
      </label>
      <button class="iconbtn" id="settingsBtn" data-act="settings" aria-label="Настройки" title="Настройки"></button>
      <button class="iconbtn" id="bellBtn" data-act="bell" aria-label="Напоминания" title="Напоминания"></button>
      <div class="user" id="userBox"></div>
    </div>
  </div>
  <nav class="tabs" role="tablist" aria-label="Разделы">
    <button class="tab" role="tab" data-act="tab" data-tab="students">Студенты на обучении</button>
    <button class="tab" role="tab" data-act="tab" data-tab="employees">Работники-выпускники</button>
    <button class="tab" role="tab" data-act="tab" data-tab="dicts">Справочники</button>
    <button class="tab" role="tab" data-act="tab" data-tab="reports">Отчёты</button>
  </nav>
</header>
<div id="bellPanel" class="bell-panel" hidden></div>
<main id="main"></main>
<div id="drawerHost"></div>
<div id="modalHost"></div>
<div id="toasts" aria-live="polite"></div>
<script>
'use strict';
/* ===== Утилиты ===== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = (n, l = 2) => String(n).padStart(l, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const toDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const fmt = s => { if (!s) return ''; const [y, m, d] = s.split('-'); return `${d}.${m}.${y}`; };

    p.status = ST.TERM;
  };
  const career = (p, hireDate) => {
    p.tab = String(ri(20000, 59999));
    let prof = p.contract.profId, org = p.placement.orgId, rank = ri(2, 3), pos = 'pos-' + prof;
    const mk = (type, date, extra = {}) => ({ id: nid('M'), type, date, orgId: org, posId: pos, profId: prof, rank: String(rank), order: nextOrder(), orderDate: addDays(date, -ri(1, 5)), reasonId: '', source: rnd() < .55 ? '1С:ЗУП' : 'Вручную', comment: '', ...extra });
    p.moves.push(mk('Приём', hireDate)); p.status = ST.HIRED;
    let t = hireDate;
    for (;;) {
      t = addDays(t, ri(170, 520)); if (t > TODAY) break;
      const r = rnd();
      if (r < .15) { p.moves.push(mk('Увольнение', t, { reasonId: pick(db.reasons).id })); p.status = ST.FIRED; break; }
      if (r < .55 && rank < 6) { rank++; if (rank >= 5 && rnd() < .3) pos = 'pos-br'; p.moves.push(mk('Повышение разряда', t)); continue; }
      if (r < .82) { org = pick([...new Set(Object.values(PROF_ORG).flat())].filter(x => x !== org)); p.moves.push(mk('Перевод', t)); continue; }
      prof = pick(db.professions.filter(x => x.id !== prof && x.id !== 'p7')).id; pos = 'pos-' + prof; org = pick(PROF_ORG[prof]); rank = Math.max(2, rank - 1);
      p.moves.push(mk('Смена профессии', t));
    }
  };

  const COH = [['2021-09-01', 6], ['2022-09-01', 7], ['2023-09-01', 7], ['2024-09-01', 7], ['2024-11-01', 3], ['2025-03-01', 3], ['2025-09-01', 7], ['2026-09-01', 6]];
  for (const [start, n] of COH) {
    const end = addDays(addMonths(start, 24), -1);
    for (let i = 0; i < n; i++) {
      const p = makeBase(start);
      if (end < TODAY) {
        if (start === '2024-09-01' && i === 0) { gradeUntil(p, TODAY); }
        else if (start === '2024-09-01' && i === 1) { gradeUntil(p, TODAY); finalize(p); p.status = ST.DONE; pendingHire.push(p); }
        else {
          const r = rnd();
          if (r < .12) { const t = ri(2, 4); terminate(p, addDays(p.exams[t - 1].plan, -ri(25, 70)), pick(BASIS)); }
          else {
            gradeUntil(p, TODAY); finalize(p);
            const hd = addDays(end, ri(12, 40));
            if (r < .34) p.status = ST.NOTH; else if (hd <= TODAY) career(p, hd); else p.status = ST.DONE;
          }
        }
      } else {
        gradeUntil(p, TODAY);
        if (start === '2025-03-01' && i === 0) { const g = p.exams.filter(e => e.grade); const e = g[g.length - 1]; if (e) { e.grade = ''; e.fact = ''; } }
        if (start === '2025-09-01' && i === n - 1) { const d = addDays(TODAY, -11); if (d > start) terminate(p, d, 'По собственному желанию'); }
      }
      delete p.skill;
      db.persons.push(p);
      db.audit.push({ ts: `${p.contract.date} 10:00`, user: 'Первичная загрузка', personId: p.id, entity: 'Карточка', action: 'Создание', details: 'Карточка создана при переносе данных из журналов' });
    }
  }
  for (const p of pendingHire) {
    const d = addDays(p.contract.end, 35) <= TODAY ? addDays(p.contract.end, 35) : TODAY;
    db.pending.push({ id: nid('E'), personId: p.id, received: TODAY, move: { type: 'Приём', date: d, orgId: p.placement.orgId, posId: 'pos-' + p.contract.profId, profId: p.contract.profId, rank: '3', order: nextOrder(), orderDate: addDays(d, -2), reasonId: '', comment: '', tab: String(ri(20000, 59999)) } });
  }
  const emp = db.persons.find(p => p.status === ST.HIRED && +lastMove(p).rank < 6 && lastMove(p).date < addDays(TODAY, -3));
  if (emp) { const m = lastMove(emp); db.pending.push({ id: nid('E'), personId: emp.id, received: TODAY, move: { ...m, id: undefined, type: 'Повышение разряда', date: addDays(TODAY, -3), rank: String(+m.rank + 1), order: nextOrder(), orderDate: addDays(TODAY, -4), reasonId: '', comment: '' } }); }
  db.exchange.push({ ts: `${TODAY} 02:00`, mode: 'OData', got: db.pending.length, pending: db.pending.length, errors: 0, user: 'Планировщик' });
  db.exchange.push({ ts: `${addDays(TODAY, -1)} 02:00`, mode: 'OData', got: 0, pending: 0, errors: 0, user: 'Планировщик' });
  db.persons.forEach(sortMoves);
  db.audit.sort((a, b) => b.ts.localeCompare(a.ts));
}

/* ===== Выгрузка в Excel (.xlsx без внешних библиотек) ===== */
const XLSX = (() => {
  const T = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; T[n] = c >>> 0; }
  const crc32 = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = T[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  const enc = new TextEncoder();
  function zip(files) {
    const parts = [], central = []; let offset = 0;
    for (const f of files) {
      const name = enc.encode(f.name), data = enc.encode(f.text), crc = crc32(data);
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
      h.setUint16(10, 0, true); h.setUint16(12, 0x21, true); h.setUint32(14, crc, true); h.setUint32(18, data.length, true);
      h.setUint32(22, data.length, true); h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
      parts.push(new Uint8Array(h.buffer), name, data);
      const c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
      c.setUint16(12, 0, true); c.setUint16(14, 0x21, true); c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true);
      c.setUint16(28, name.length, true); c.setUint16(30, 0, true); c.setUint16(32, 0, true); c.setUint16(34, 0, true); c.setUint16(36, 0, true);
      c.setUint32(38, 0, true); c.setUint32(42, offset, true);
      central.push(new Uint8Array(c.buffer), name);
      offset += 30 + name.length + data.length;
    }
    const size = central.reduce((s, x) => s + x.length, 0);
    const e = new DataView(new ArrayBuffer(22));
    e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, size, true); e.setUint32(16, offset, true);
    return [...parts, ...central, new Uint8Array(e.buffer)];
  }
  const xe = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
  const col = i => { let s = ''; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };
  const cell = (ref, v, s) => {
    const st = s ? ` s="${s}"` : '';
    if (v === null || v === undefined || v === '') return s ? `<c r="${ref}"${st}/>` : '';
    if (typeof v === 'number') return `<c r="${ref}"${st}><v>${v}</v></c>`;
    return `<c r="${ref}" t="inlineStr"${st}><is><t xml:space="preserve">${xe(v)}</t></is></c>`;
  };
  const NS = 'http://schemas.openxmlformats.org';
  const STYLES = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="${NS}/spreadsheetml/2006/main"><fonts count="3"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="14"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE3E8EC"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"><color rgb="FFB0BAC2"/></left><right style="thin"><color rgb="FFB0BAC2"/></right><top style="thin"><color rgb="FFB0BAC2"/></top><bottom style="thin"><color rgb="FFB0BAC2"/></bottom><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="8"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment wrapText="1" vertical="center"/></xf><xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment wrapText="1" vertical="top"/></xf><xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="9" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1"/><xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
  function build(r) {
    const rows = [[{ v: r.title, s: 4 }], ...r.meta.map(m => [{ v: m, s: 5 }]), []];
    const widths = [];
    for (const sec of r.sections) {
      if (sec.title) rows.push([{ v: sec.title, s: 1 }]);
      rows.push(sec.columns.map(c => ({ v: c.h, s: 2 })));
      sec.columns.forEach((c, i) => widths[i] = Math.max(widths[i] || 0, c.w || 12));
      for (const row of sec.rows) {
        if (row.section) { rows.push([{ v: row.section, s: 1 }]); continue; }
        rows.push(row.map((v, i) => {
          const c = sec.columns[i] || {};

    }
    const data = rows.map((r2, ri2) => `<row r="${ri2 + 1}">${r2.map((c, ci) => cell(col(ci) + (ri2 + 1), c.v, c.s)).join('')}</row>`).join('');
    const cols = widths.length ? `<cols>${widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('')}</cols>` : '';
    return zip([
      { name: '[Content_Types].xml', text: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="${NS}/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>` },
      { name: '_rels/.rels', text: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${NS}/package/2006/relationships"><Relationship Id="rId1" Type="${NS}/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
      { name: 'xl/workbook.xml', text: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="${NS}/spreadsheetml/2006/main" xmlns:r="${NS}/officeDocument/2006/relationships"><sheets><sheet name="Отчёт" sheetId="1" r:id="rId1"/></sheets></workbook>` },
      { name: 'xl/_rels/workbook.xml.rels', text: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${NS}/package/2006/relationships"><Relationship Id="rId1" Type="${NS}/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="${NS}/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>` },
      { name: 'xl/styles.xml', text: STYLES },
      { name: 'xl/worksheets/sheet1.xml', text: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="${NS}/spreadsheetml/2006/main">${cols}<sheetData>${data}</sheetData></worksheet>` }
    ]);
  }
  return { build };
})();

  const d = dis || !canEdit() ? ' disabled' : '';
  if (type === 'checkbox') return `<label class="field inline${wide ? ' wide' : ''}"><input type="checkbox" name="${name}"${value ? ' checked' : ''}${d}> ${esc(label)}</label>`;

}

/* ===== Напоминания ===== */
function reminders() {
  const out = [], ed = +db.settings.examDays, cd = +db.settings.contractDays;
  for (const p of db.persons) {
    if (p.status !== ST.TRAIN) continue;
    for (const e of p.exams) {
      if (e.grade) continue;
      const d = daysBetween(TODAY, e.plan);
      if (d < 0) out.push({ kind: 'overdue', label: 'Просрочен экзамен', p, date: e.plan, text: `Экзамен за ${e.sem}-й семестр: оценки нет уже ${dn(-d)}`, prio: 0 });
      else if (d <= ed) out.push({ kind: 'exam', label: 'Экзамен', p, date: e.plan, text: `Экзамен за ${e.sem}-й семестр через ${dn(d)}`, prio: 1 });
    }
    const dc = daysBetween(TODAY, p.contract.end);
    if (dc >= 0 && dc <= cd) out.push({ kind: 'contract', label: 'Окончание договора', p, date: p.contract.end, text: `Договор заканчивается через ${dn(dc)}`, prio: 2 });
    if (dc < 0) out.push({ kind: 'final', label: 'Нет итоговых данных', p, date: p.contract.end, text: 'Договор окончен, а итоговая оценка или диплом не внесены', prio: 0 });
  }
  if (db.pending.length) out.push({ kind: '1c', label: '1С:ЗУП', p: null, date: TODAY, text: `Событий из 1С:ЗУП ждут подтверждения: ${db.pending.length}`, prio: 1 });
  return out.sort((a, b) => a.prio - b.prio || a.date.localeCompare(b.date));
}

function sync1c() {
  const got = [];
  const pool = db.persons.filter(p => p.status === ST.HIRED && !db.pending.some(e => e.personId === p.id));
  const k = Math.min(pool.length, ri(1, 3));
  for (let i = 0; i < k; i++) {
    const p = pool.splice(Math.floor(rnd() * pool.length), 1)[0], cur = lastMove(p);
    const type = +cur.rank < 6 && rnd() < .6 ? 'Повышение разряда' : 'Перевод';
    const mv = { type, date: TODAY, orgId: cur.orgId, posId: cur.posId, profId: cur.profId, rank: cur.rank, order: `${ri(400, 599)}-к`, orderDate: addDays(TODAY, -1), reasonId: '', comment: '' };
    if (type === 'Повышение разряда') mv.rank = String(+cur.rank + 1); else mv.orgId = pick([...new Set(Object.values(PROF_ORG).flat())].filter(x => x !== cur.orgId));
    got.push({ id: nid('E'), personId: p.id, received: TODAY, move: mv });
  }
  db.pending.push(...got);
  db.exchange.unshift({ ts: `${TODAY} ${hhmm()}`, mode: db.settings.mode === 'file' ? 'Файл' : 'OData', got: got.length, pending: db.pending.length, errors: 0, user: ROLES[S.role].user });
  toast(got.length ? `Получено событий из 1С:ЗУП: ${got.length}. Проверьте и подтвердите их.` : 'Новых событий в 1С:ЗУП нет');
  renderAll();
}
function confirm1c(id, ok) {
  const e = db.pending.find(x => x.id === id); if (!e) return;
  const p = byId(db.persons, e.personId), m = e.move;
  db.pending = db.pending.filter(x => x !== e);
  if (!ok) { log(p.id, 'Обмен с 1С:ЗУП', 'Отклонено', `${m.type} от ${fmt(m.date)}, приказ № ${m.order}`); toast('Событие отклонено и не попадёт в журнал'); renderAll(); return; }
  if (p.moves.some(x => x.date === m.date && x.type === m.type && x.order === m.order)) { toast('Такое событие уже есть в журнале. Дубль не создан.'); renderAll(); return; }
  if (m.type === 'Приём' && !p.tab && m.tab) p.tab = m.tab;
  const { tab, ...rest } = m;
  p.moves.push({ ...rest, id: nid('M'), source: '1С:ЗУП' }); sortMoves(p);
  if (m.type === 'Приём') p.status = ST.HIRED;
  if (m.type === 'Увольнение') p.status = ST.FIRED;
  log(p.id, 'Журнал перемещений', 'Создание', `${m.type} от ${fmt(m.date)}, приказ № ${m.order} (из 1С:ЗУП, подтверждено)`);
  toast('Событие подтверждено и добавлено в журнал перемещений');
  renderAll();
}

/* ===== Сохранение разделов карточки ===== */
function saveSection(k, root) {
  const p = byId(db.persons, S.open), v = readFields(root);
  let errs = {}, ch = [], entity = '';
  if (k === 'general') {
    errs = requireFields(v, ['last', 'first', 'birth']);
    if (v.tab && db.persons.some(x => x !== p && x.tab === v.tab)) errs.tab = 'Такой табельный номер уже есть у другого человека';
    if (v.email && !/^\S+@\S+\.\S+$/.test(v.email)) errs.email = 'Проверьте формат адреса';
    if (!markErrors(root, errs)) return;
    entity = 'Общие данные';
    ch = applyChanges(p, v, { last: 'Фамилия', first: 'Имя', middle: 'Отчество', birth: 'Дата рождения', tab: 'Табельный номер', consent: 'Согласие на обработку ПДн', phone: 'Телефон', email: 'E-mail', note: 'Примечание' });
  }
  if (k === 'contract') {
    errs = requireFields(v, ['num', 'date', 'instId', 'profId', 'group', 'course', 'start', 'end', 'mentorId']);
    if (!v.orgId || orgChain(v.orgId).length < 2) errs.orgId = 'Выберите как минимум цех и участок';
    if (v.start && v.end && v.end <= v.start) errs.end = 'Окончание должно быть позже начала';
    if (v.course && (+v.course < 1 || +v.course > 6)) errs.course = 'Курс от 1 до 6';
    if (!markErrors(root, errs)) return;
    entity = 'Договор и практика';
    ch = applyChanges(p.contract, v, { num: 'Номер договора', date: 'Дата договора', instId: ['Учебное заведение', x => nameOf(db.institutions, x)], profId: ['Профессия', x => nameOf(db.professions, x)], group: 'Группа', course: 'Курс', start: 'Начало', end: 'Плановое окончание' })
      .concat(applyChanges(p.placement, v, { orgId: ['Место практики', x => orgPath(x)], mentorId: ['Наставник', x => byId(db.mentors, x)?.fio] }));
  }
  if (k === 'exams') {
    for (const e of p.exams) {
      if (!v[`e${e.sem}_plan`]) errs[`e${e.sem}_plan`] = 'Укажите дату';
      if (v[`e${e.sem}_grade`] && !v[`e${e.sem}_fact`]) errs[`e${e.sem}_fact`] = 'Укажите дату экзамена';
      if (v[`e${e.sem}_fact`] > TODAY) errs[`e${e.sem}_fact`] = 'Дата ещё не наступила';
    }
    if (!markErrors(root, errs)) return;
    entity = 'Экзамены и оценки';
    for (const e of p.exams) ch.push(...applyChanges(e, { plan: v[`e${e.sem}_plan`], fact: v[`e${e.sem}_fact`], grade: v[`e${e.sem}_grade`], comment: v[`e${e.sem}_comment`] },
      { plan: `${e.sem} сем., плановая дата`, fact: `${e.sem} сем., дата экзамена`, grade: `${e.sem} сем., оценка`, comment: `${e.sem} сем., комментарий` }));
    ch.push(...applyChanges(p.final, { grade: v.fgrade, mentorGrade: v.mgrade, mentorText: v.mtext }, { grade: 'Итоговая оценка', mentorGrade: 'Оценка наставника', mentorText: 'Характеристика наставника' }));
  }
  if (k === 'diploma') {
    if (v.date && v.date > TODAY) errs.date = 'Дата ещё не наступила';
    if ((v.num || v.date || v.qual) && !(v.num && v.date && v.qual)) { if (!v.num) errs.num = 'Заполните поле'; if (!v.date) errs.date = 'Заполните поле'; if (!v.qual) errs.qual = 'Заполните поле'; }
    if (!markErrors(root, errs)) return;
    entity = 'Диплом';
    ch = applyChanges(p.diploma, v, { num: 'Номер', date: 'Дата выдачи', qual: 'Квалификация', honors: 'С отличием' });
  }
  if (!ch.length) { toast('Изменений нет'); return; }
  log(p.id, entity, 'Изменение', ch.join('; '));
  toast('Изменения сохранены');
  renderAll();
}

  const hires = db.persons.filter(p => firstHire(p));
  const by = {}; hires.forEach(p => { const y = yearOf(firstHire(p).date); (by[y] = by[y] || []).push(p); });
  const dismissDate = p => p.moves.find(m => m.type === 'Увольнение')?.date || null;
  const calc = (list, k) => { const el = list.filter(p => addMonths(firstHire(p).date, 12 * k) <= TODAY); const kept = el.filter(p => { const d = dismissDate(p); return !d || d >= addMonths(firstHire(p).date, 12 * k); }); return pct(kept.length, el.length); };
  const ys = Object.keys(by).sort((a, b) => b - a);
  const rows = ys.map(y => [y, by[y].length, by[y].filter(p => p.status === ST.HIRED).length, ...Array.from({ length: N }, (_, i) => calc(by[y], i + 1))]);
  if (ys.length) rows.push(total(['Все годы', hires.length, hires.filter(p => p.status === ST.HIRED).length, ...Array.from({ length: N }, (_, i) => calc(hires, i + 1))]));
  const fired = hires.filter(p => p.status === ST.FIRED);
  const rc = {}; fired.forEach(p => { const r = nameOf(db.reasons, p.moves.find(m => m.type === 'Увольнение').reasonId); rc[r] = (rc[r] || 0) + 1; });
  const rrows = Object.entries(rc).sort((a, b) => b[1] - a[1]).map(([r, n]) => [r, n, pct(n, fired.length)]);
  return { title: 'Удержание выпускников', meta: metaLines(`горизонт ${N} ${plural(N, 'год', 'года', 'лет')}`), count: rows.length, sections: [
    { title: 'Доля работающих через N лет после приёма', columns: [{ h: 'Год приёма', w: 14 }, { h: 'Принято', w: 10 }, { h: 'Работают сейчас', w: 12 }, ...Array.from({ length: N }, (_, i) => ({ h: `Через ${i + 1} ${plural(i + 1, 'год', 'года', 'лет')}`, w: 14, type: 'pct' }))], rows },
    { title: 'Причины увольнения', columns: [{ h: 'Причина', w: 30 }, { h: 'Уволено', w: 10 }, { h: 'Доля', w: 14, type: 'pct' }], rows: rrows }] };
}
function rptGrades(f) {
  const list = db.persons.filter(p => !f.year || String(startYear(p)) === f.year);
  const avg = a => a.length ? Math.round(a.reduce((x, y) => x + y, 0) / a.length * 100) / 100 : '';
  const line = (name, ps) => { const ex = ps.flatMap(p => p.exams.filter(e => e.grade).map(e => +e.grade)); const dip = ps.filter(p => p.diploma.num);
    return [name, ps.length, avg(ex), avg(ps.filter(p => p.final.grade).map(p => +p.final.grade)), avg(ps.filter(p => p.final.mentorGrade).map(p => +p.final.mentorGrade)), dip.length, pct(dip.filter(p => p.diploma.honors).length, dip.length)]; };
  const rows = db.institutions.map(i => line(i.short, list.filter(p => p.contract.instId === i.id))).filter(r => r[1]);
  if (rows.length) rows.push(total(line('Все учебные заведения', list)));
  return { title: 'Оценки по учебным заведениям', meta: metaLines(f.year ? `год набора ${f.year}` : ''), count: rows.length, sections: [{ columns: [{ h: 'Учебное заведение', w: 30 }, { h: 'Студентов', w: 10 }, { h: 'Средний балл за экзамены', w: 14 }, { h: 'Средняя итоговая оценка', w: 14 }, { h: 'Средняя оценка наставника', w: 14 }, { h: 'Дипломов', w: 10 }, { h: 'С отличием', w: 14, type: 'pct' }], rows }] };
}
function rptFlow() {
  const ys = [...new Set(db.persons.map(startYear))].sort((a, b) => b - a);
  const line = (name, ps) => { const t = ps.filter(p => p.status === ST.TERM); return [name, ps.length, ps.filter(p => p.status === ST.TRAIN).length, ps.filter(p => [ST.DONE, ST.NOTH, ST.HIRED, ST.FIRED].includes(p.status)).length, t.length, t.filter(p => p.contract.termBasis === 'Отчисление').length, t.filter(p => p.contract.termBasis !== 'Отчисление').length]; };
  const rows = ys.map(y => line(String(y), db.persons.filter(p => startYear(p) === y))); rows.push(total(line('Итого', db.persons)));
  return { title: 'Движение контингента', meta: metaLines(''), count: rows.length, sections: [{ columns: [{ h: 'Год набора', w: 12 }, { h: 'Принято на обучение', w: 14 }, { h: 'На обучении', w: 12 }, { h: 'Завершили обучение', w: 14 }, { h: 'Расторгнуто', w: 12 }, { h: 'Отчисление', w: 12 }, { h: 'По собственному желанию', w: 16 }], rows }] };
}
function buildReport() {
  const r = S.report;
  if (r === 'journal') return rptJournal(S.f.rj);
  if (r === 'moves') return rptMoves(S.f.rm);
  if (r === 'card') return rptCard(S.f.rc.id);
  if (r === 'employment') return rptEmployment(S.f.ra);
  if (r === 'retention') return rptRetention(S.f.rr);
  if (r === 'grades') return rptGrades(S.f.rg);
  return rptFlow();
}
function reportFilters() {
  const r = S.report;
  if (r === 'journal') return `${fSearch('rj.q', 'ФИО')}${fSel('rj.year', 'Год набора', yearsList())}${fSel('rj.inst', 'Учебное заведение', db.institutions.map(i => ({ id: i.id, name: i.short })))}${fSel('rj.prof', 'Профессия', db.professions)}${fSel('rj.shop', 'Цех практики', shops())}${fSel('rj.mentor', 'Наставник', mentorList())}${fSel('rj.status', 'Статус', statusList(Object.values(ST)))}<label class="f check"><input type="checkbox" data-f="rj.chr"${S.f.rj.chr ? ' checked' : ''}> Включить характеристику наставника</label>`;
  if (r === 'moves') return `<label class="f"><span>Вид журнала</span><select data-f="rm.mode">${options([{ id: 'full', name: 'Все события' }, { id: 'current', name: 'Текущее положение' }], S.f.rm.mode, { empty: null })}</select></label>${fSearch('rm.q', 'ФИО')}${S.f.rm.mode === 'full' ? fDate('rm.from', 'Период с') + fDate('rm.to', 'по') : ''}${fSel('rm.shop', 'Цех', shops())}${fSel('rm.prof', 'Профессия', db.professions)}`;
  if (r === 'card') return `<label class="f search"><span>Человек</span><select data-f="rc.id">${options([...db.persons].sort((a, b) => fio(a).localeCompare(fio(b), 'ru')).map(p => ({ id: p.id, name: `${fio(p)}, ${fmt(p.birth)}` })), S.f.rc.id, { empty: '— выберите —' })}</select></label>`;
  if (r === 'employment') return `<label class="f"><span>Разрез</span><select data-f="ra.dim">${options([{ id: 'year', name: 'По годам выпуска' }, { id: 'inst', name: 'По учебным заведениям' }, { id: 'prof', name: 'По профессиям' }], S.f.ra.dim, { empty: null })}</select></label>`;
  if (r === 'retention') return `<label class="f"><span>Горизонт, лет (N)</span><select data-f="rr.n">${options([1, 2, 3, 4, 5].map(n => ({ id: String(n), name: String(n) })), S.f.rr.n, { empty: null })}</select></label>`;
  if (r === 'grades') return fSel('rg.year', 'Год набора', yearsList());
  return '';
}
function viewReports() {
  const side = REPORTS.map(([g, list]) => `<div class="grp">${g}</div>${list.map(([k, t]) => `<button data-act="report" data-k="${k}" aria-current="${k === S.report}">${t}</button>`).join('')}`).join('');
  const flt = reportFilters();
  return `<div class="page-head"><div><h1>Отчёты</h1><p class="sub">Просмотрите отчёт на экране и выгрузите его в Excel</p></div></div>
  <div class="split"><nav class="panel side no-print" aria-label="Отчёты">${side}</nav>
  <section class="panel print-area"><div class="p-head"><h2>${R_TITLE[S.report]}</h2><div class="actions no-print">
    ${S.report === 'card' ? `<button class="btn" data-act="print">${ICON.print} Печать</button>` : ''}<button class="btn primary" data-act="export-report">${ICON.dl} Выгрузить в Excel</button></div></div>
  ${flt ? `<div class="filters no-print">${flt}</div>` : ''}<div id="rbody"></div></section></div>`;
}
function cellView(v, c) {
  if (c?.type === 'pct') return v == null ? '<span class="sub">—</span>' : `<span class="bar"><span class="tr"><i style="width:${Math.round(v.pct * 100)}%"></i></span><span>${esc(v.label)}</span></span>`;
  return esc(nf(v));
}
function renderReportBody() {
  const host = $('#rbody'); if (!host) return;
  const r = buildReport();
  if (!r) { host.innerHTML = '<div class="empty">Выберите человека, чтобы сформировать карточку.</div>'; return; }
  const limit = 300;
  host.innerHTML = `<div class="print-only" style="padding:0 14px"><p>${r.meta.map(esc).join('<br>')}</p></div>` +
    (S.report === 'journal' || S.report === 'moves' ? `<div class="rcount">Строк в отчёте: ${r.count}${r.count > limit ? `. На экране первые ${limit}, в файле все` : ''}</div>` : '') +
    r.sections.map(sec => `${sec.title ? `<h3 class="sec-t">${esc(sec.title)}</h3>` : ''}<div class="table-wrap"><table class="grid"><thead><tr>${sec.columns.map(c => `<th>${esc(c.h)}</th>`).join('')}</tr></thead><tbody>
      ${sec.rows.length ? sec.rows.slice(0, limit).map(row => `<tr${row.total ? ' class="total"' : ''}>${row.map((v, i) => `<td${typeof v === 'number' ? ' class="num"' : ''}>${cellView(v, sec.columns[i])}</td>`).join('')}</tr>`).join('')
        : `<tr><td colspan="${sec.columns.length}" class="empty">Нет данных по выбранным фильтрам. Измените фильтры.</td></tr>`}</tbody></table></div>`).join('');
}
const R_FILE = { journal: 'Журнал_обучения', moves: 'Журнал_перемещений', card: 'Карточка', employment: 'Трудоустройство', retention: 'Удержание', grades: 'Оценки_по_учебным_заведениям', flow: 'Движение_контингента' };

/* ===== Настройки (администратор) ===== */
function settingsModal() {
  const s = db.settings;
  openModal({ title: 'Настройки', wide: true, ok: 'Сохранить настройки', body: `
    <h3>Напоминания</h3><div class="form-grid">
      ${fld('examDays', 'Об экзамене за, дней', { type: 'number', value: s.examDays, req: 1, attrs: ' min="1" max="90"' })}
      ${fld('contractDays', 'Об окончании договора за, дней', { type: 'number', value: s.contractDays, req: 1, attrs: ' min="1" max="180"' })}
      ${fld('email', 'Ежедневная сводка на e-mail через корпоративный почтовый сервер', { type: 'checkbox', value: s.email, wide: 1 })}</div>
    <h3 style="margin-top:18px">Обмен с 1С:ЗУП</h3><div class="form-grid">
      ${fld('mode', 'Способ обмена', { type: 'select', opts: options([{ id: 'odata', name: 'REST-интерфейс 1С (OData)' }, { id: 'file', name: 'Файлы в сетевой папке' }], s.mode, { empty: null }) })}
      ${fld('time', 'Время ежедневного обмена', { type: 'time', value: s.time })}
      ${fld('odataUrl', 'Адрес OData', { value: s.odataUrl, wide: 1 })}${fld('folder', 'Сетевая папка обмена', { value: s.folder, wide: 1 })}</div>
    <h3 style="margin-top:18px">Доступ по группам Active Directory</h3>
    <div class="table-wrap"><table class="grid"><thead><tr><th>Роль</th><th>Группа AD</th></tr></thead><tbody><tr><td>Администратор</td><td>DualEdu_Admins</td></tr><tr><td>Специалист по обучению</td><td>DualEdu_Specialists</td></tr><tr><td>Просмотр</td><td>DualEdu_Viewers</td></tr></tbody></table></div>
    <h3 style="margin-top:18px">Журнал обмена с 1С:ЗУП</h3>
    <div class="table-wrap"><table class="grid"><thead><tr><th>Дата и время</th><th>Способ</th><th>Получено</th><th>Ожидают</th><th>Ошибки</th><th>Запустил</th></tr></thead><tbody>${db.exchange.slice(0, 10).map(x => `<tr><td>${fmt(x.ts.slice(0, 10))} ${x.ts.slice(11)}</td><td>${x.mode}</td><td class="num">${x.got}</td><td class="num">${x.pending}</td><td class="num">${x.errors}</td><td>${esc(x.user)}</td></tr>`).join('')}</tbody></table></div>
    <h3 style="margin-top:18px">Журнал аудита (последние 40 записей)</h3>
    <div class="table-wrap"><table class="grid"><thead><tr><th>Дата и время</th><th>Пользователь</th><th>Объект</th><th>Действие</th><th>Подробности</th></tr></thead><tbody>${db.audit.slice(0, 40).map(a => `<tr><td>${fmt(a.ts.slice(0, 10))} ${a.ts.slice(11)}</td><td>${esc(a.user)}</td><td>${a.personId ? esc(fio(byId(db.persons, a.personId))) + '<small>' + esc(a.entity) + '</small>' : esc(a.entity)}</td><td>${esc(a.action)}</td><td>${esc(a.details)}</td></tr>`).join('')}</tbody></table></div>
    <div class="hint">В рабочей версии подключение к AD и 1С:ЗУП выполняет сервер. В этой демонстрации обмен имитируется, а данные хранятся только до перезагрузки страницы.</div>`,
    onOk: root => {
      const v = readFields(root), errs = {};
      if (!(+v.examDays >= 1)) errs.examDays = 'Укажите число дней'; if (!(+v.contractDays >= 1)) errs.contractDays = 'Укажите число дней';
      if (!markErrors(root, errs)) return false;
      const ch = applyChanges(s, { ...v, examDays: String(+v.examDays), contractDays: String(+v.contractDays) }, { examDays: 'Напоминание об экзамене, дней', contractDays: 'Напоминание об окончании договора, дней', email: 'E-mail-сводка', mode: 'Способ обмена', time: 'Время обмена', odataUrl: 'Адрес OData', folder: 'Сетевая папка' });
      if (ch.length) log(null, 'Настройки', 'Изменение', ch.join('; '));
      toast('Настройки сохранены'); renderAll();
    } });
}

/* ===== События ===== */
document.addEventListener('click', e => {
  const bp = $('#bellPanel');
  if (!bp.hidden && !e.target.closest('#bellPanel') && !e.target.closest('[data-act="bell"]')) bp.hidden = true;
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act, p = S.open && byId(db.persons, S.open);
  switch (act) {
    case 'tab': S.tab = a.dataset.tab; renderMain(); renderHeader(); window.scrollTo(0, 0); break;
    case 'sort': break;
    case 'page': { const f = S.f[a.dataset.scope]; f.page = +a.dataset.p; renderTable(a.dataset.scope); break; }
    case 'open': openCard(a.dataset.id, a.dataset.tab); break;
    case 'close-card': S.open = null; renderDrawer(); break;
    case 'card-tab': S.cardTab = a.dataset.k; renderDrawer(); break;
    case 'save': saveSection(a.dataset.k, a.closest('[data-form]')); break;
    case 'suggest-final': { const s = $('select[name="fgrade"]'); if (s) { s.value = a.dataset.v; toast('Оценка подставлена. Сохраните изменения.'); } break; }
    case 'terminate': terminateModal(p); break;
    case 'complete': completeModal(p); break;
    case 'nothire': notHiredModal(p); break;
    case 'move': moveModal(p, a.dataset.type); break;
    case 'set-status': statusModal(p); break;
    case 'add-student': addStudent(); break;
    case 'export-students': exportReport(rptJournal({ ...S.f.students, chr: false }), 'Журнал_обучения'); break;
    case 'export-moves': exportReport(rptMoves({ ...S.f.employees, mode: a.dataset.mode, from: '', to: '' }), a.dataset.mode === 'full' ? 'Журнал_перемещений' : 'Текущее_положение'); break;
    case 'sync': sync1c(); break;
    case 'c1-ok': confirm1c(a.dataset.id, true); break;
    case 'c1-no': confirm1c(a.dataset.id, false); break;
    case 'bell': bp.hidden = !bp.hidden; if (!bp.hidden) renderBell(); break;
    case 'ev': { const r = reminders()[+a.dataset.i]; bp.hidden = true; if (!r) break; if (r.p) openCard(r.p.id, r.kind === 'contract' ? 'contract' : r.kind === 'final' ? 'exams' : 'exams'); else { S.tab = 'employees'; S.open = null; renderAll(); } break; }
    case 'settings': settingsModal(); break;
    case 'dict': S.dict = a.dataset.k; renderMain(); break;
    case 'dict-edit': dictEdit(a.dataset.id); break;
    case 'dict-toggle': { const x = byId(DICTS[S.dict].list(), a.dataset.id); x.active = x.active === false; log(null, `Справочник «${DICTS[S.dict].title}»`, x.active ? 'Восстановление' : 'Пометка недействующей', x.name || x.fio); toast(x.active ? 'Запись снова действует' : 'Запись помечена недействующей. В старых записях она по-прежнему отображается.'); renderMain(); break; }
    case 'org-add': orgEdit('', a.dataset.parent); break;
    case 'org-edit': orgEdit(a.dataset.id); break;
    case 'org-toggle': { const o = byId(db.org, a.dataset.id); o.active = o.active === false; log(null, 'Структура предприятия', o.active ? 'Восстановление' : 'Пометка недействующим', orgPath(o.id)); toast(o.active ? 'Подразделение снова действует' : 'Подразделение помечено недействующим'); renderMain(); break; }
    case 'report': S.report = a.dataset.k; renderMain(); break;
    case 'export-report': { const r = buildReport(); if (!r) { toast('Сначала выберите человека'); break; } exportReport(r, R_FILE[S.report]); break; }
    case 'print': if (!S.f.rc.id) toast('Сначала выберите человека'); else window.print(); break;
    case 'modal-close': closeModal(); break;
    case 'modal-bg': if (e.target === a) closeModal(); break;
    case 'modal-ok': { const root = $('#modalHost .m-body'); if (modalCtx?.onOk(root) !== false) { if ($('#modalHost .m-body') === root) closeModal(); } break; }
  }
  const sh = e.target.closest('th[data-sort]');
  if (sh) { const [sc, k] = sh.dataset.sort.split('.'); const f = S.f[sc]; if (f.sort === k) f.dir = -f.dir; else { f.sort = k; f.dir = 1; } f.page = 1; renderTable(sc); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('[data-f]')) {
    const [sc, k] = t.dataset.f.split('.');
    S.f[sc][k] = t.type === 'checkbox' ? t.checked : t.value;
    if ('page' in S.f[sc]) S.f[sc].page = 1;
    if (sc === 'students' || sc === 'employees') renderTable(sc);
    else if (sc === 'rm' && k === 'mode') renderMain();
    else renderReportBody();
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('select[data-cascade]')) {
    const root = t.closest('[data-cascade-root]'), i = +t.dataset.cascade;
    const id = t.value || (i > 0 ? root.querySelector(`[data-cascade="${i - 1}"]`).value : '');
    root.innerHTML = cascadeHTML(id);
    root.querySelector(`[data-cascade="${i}"]`)?.focus();
    const form = root.closest('.m-body, .section'), ms = form?.querySelector('select[name="mentorId"]');
    if (ms) ms.innerHTML = mentorOpts(readCascade(root), ms.value);
  }
  if (t.matches('#modalHost input[name="start"]')) { const end = $('#modalHost input[name="end"]'); if (end && !end.value && t.value) end.value = addDays(addMonths(t.value, 24), -1); }
  if (t.id === 'roleSel') {
    S.role = t.value; closeModal(); $('#bellPanel').hidden = true;
    renderAll(); toast(`Роль: ${ROLES[S.role].name}`);
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#modalHost').innerHTML) closeModal(); else if (!$('#bellPanel').hidden) $('#bellPanel').hidden = true; else if (S.open) { S.open = null; renderDrawer(); } }
  if (e.key === 'Enter' && e.target.matches('tr[data-act="open"]')) openCard(e.target.dataset.id, e.target.dataset.tab);
});

renderAll();
